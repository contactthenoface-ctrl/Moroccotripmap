<!-- Bouton Retour en haut -->
<button id="scrollToTopBtn" aria-label="Retour en haut" class="fixed bottom-6 right-6 z-50 hidden bg-sombre/60 hover:bg-sombre text-creme p-3 rounded-full shadow-lg backdrop-blur-md transition-all duration-300 transform hover:scale-105">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"/>
    </svg>
</button>

<script>
    const scrollToTopBtn = document.getElementById('scrollToTopBtn');

    // Afficher ou masquer le bouton selon le scroll
    window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
            scrollToTopBtn.classList.remove('hidden');
        } else {
            scrollToTopBtn.classList.add('hidden');
        }
    });

    // Remonter en haut de page en douceur au clic
    scrollToTopBtn.addEventListener('click', () => {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });
</script>
